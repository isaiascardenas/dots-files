# Terminal capabilities for Ghostty and xterm-compatible terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -g status-interval 4

# Forward navigation to Vim/Neovim; otherwise move between tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# tmux 3.x escaping; no legacy version detection or bc dependency needed.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Vi copy mode.
setw -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

set -g mouse on
set -g status-position bottom
setw -g xterm-keys on
bind-key -n S-Up set-option -g status
bind-key -n S-Down set-option -g status
bind-key -n S-Left previous-window
bind-key -n S-Right next-window
bind k confirm-before kill-window

# Close the current session and switch to another available session.
set -g detach-on-destroy off
bind d kill-session

# Create and switch to a named session with Prefix + Shift+n.
bind-key N command-prompt -p 'New session name:' 'new-session -s "%%"'

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Palette: primary purple with mauve, berry, and plum from the reference.
# These variables are expanded when this configuration is loaded.
theme_primary="#9ca0f0"
theme_primary_surface="#353863"
theme_secondary="#9882b9"
theme_muted="#775e88"
theme_action="#722548"
theme_danger="#541533"
theme_surface="#221932"
theme_background="#060407"
theme_text="#d2d3d7"

# Status bar and selection styling.
setw -g mode-style "bg=$theme_action,fg=$theme_text"
# Session/window chooser preview frame, overlay label, and selected row.
setw -g tree-mode-border-style "fg=$theme_secondary,bg=$theme_surface"
setw -g tree-mode-preview-style "fg=$theme_primary,bg=$theme_surface"
setw -g tree-mode-selection-style "fg=$theme_text,bg=$theme_action,bold"
set -g status-style "fg=$theme_text,bg=default"
setw -g window-status-style "fg=$theme_muted,bg=default"
setw -g window-status-current-style "fg=$theme_primary,bg=default"
# Shared styling for status-line prompts and messages.
set -g message-style "fg=$theme_primary,bg=$theme_surface,bold"
set -g message-command-style "fg=$theme_secondary,bg=$theme_surface,bold"
set -g status-left-length 60
# Session badge: terminal icon normally, mauve copy icon in copy mode.
# Count one character per pane across every window in this session.
# Use the terminal background after the rounded separator.
set -g status-left "#[fg=#{?pane_in_mode,$theme_secondary,$theme_text},bg=#{?pane_in_mode,$theme_surface,$theme_primary_surface},bold] #{?pane_in_mode,󰆏,}  #S #[fg=#{?pane_in_mode,$theme_surface,$theme_primary_surface},bg=default,nobold]#[fg=$theme_secondary,bg=default,bold]    #{n:#{W:#{P:x}}} #[default] "
setw -g window-status-format '#{pane_current_command} '
setw -g window-status-current-format "#[fg=$theme_primary_surface,bg=default]#[fg=$theme_primary,bg=$theme_primary_surface,bold] #{pane_current_command} #[fg=$theme_primary_surface,bg=default,nobold] "

# tmux runs #() asynchronously and caches its latest output between refreshes.
set -g status-right-length 60
set -g status-right "#[fg=#1DB954,bg=default]#(\"$HOME/.config/tmux/scripts/spotify-status.sh\")#[default]"
