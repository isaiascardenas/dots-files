# Terminal capabilities for Ghostty and xterm-compatible terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -g status-interval 5

# Forward navigation to Vim/Neovim; otherwise move between tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# tmux 3.x escaping; no legacy version detection or bc dependency needed.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Vi copy mode.
setw -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

set -g mouse on
set -g status-position bottom
setw -g xterm-keys on
bind-key -n S-Up set-option -g status
bind-key -n S-Down set-option -g status
bind-key -n S-Left previous-window
bind-key -n S-Right next-window
bind k confirm-before kill-window

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Status bar and selection styling.
setw -g mode-style 'bg=#353863,fg=#9ca0f0'
set -g status-style 'fg=white,bg=default'
setw -g window-status-style 'fg=#666666,bg=default'
setw -g window-status-current-style 'fg=red,bg=default'
set -g message-style 'fg=white,bg=black,bright'
set -g status-left ' '
setw -g window-status-format '#{pane_current_command} '
setw -g window-status-current-format '#[fg=#9ca0f0,bg=#353863]  #{pane_current_command} #[fg=#353863,bg=default]'

# TODO: Add Spotify current playing
set -g status-right ''
